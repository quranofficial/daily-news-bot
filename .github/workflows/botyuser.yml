
name: Quran User Bot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quran-user-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ""

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required files
        run: |
          test -f quran_video.py
          test -f botyuser.py
          test -f fonts/quran1.ttf
          test -f fonts/quran2.ttf
          test -f fonts/quran3.ttf
          test -f fonts/rabar1.ttf
          test -f fonts/rabar2.ttf
          test -f fonts/rabar3.ttf

      - name: Start Telegram bot
        run: python -u botyuser.py
